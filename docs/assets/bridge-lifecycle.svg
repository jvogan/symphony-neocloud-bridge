<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 625" width="1310" height="625" role="img" aria-labelledby="title desc"><title id="title">Cloud execution lifecycle</title><desc id="desc">Six steps: define the contract, check and prepare, launch once, observe the workload, verify artifacts, and close the run.</desc><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1310" height="625" fill="#ffffff"/><g transform="translate(40 40) rotate(0 282.534 19.55)"><text x="0" y="28.731" font-family="Helvetica, Segoe UI Emoji" font-size="34px" fill="#142b3b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A cloud run, with a verifiable outcome</text></g><g transform="translate(40 95) rotate(0 330.56 12.075)"><text x="0" y="17.745" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#536b7d" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Plan locally. Authorize execution. Validate outputs and close resources.</text></g><g stroke-linecap="round" transform="translate(40 170) rotate(0 185 85)"><path d="M32 0 C128.32 0, 224.64 0, 338 0 C359.33 0, 370 10.67, 370 32 C370 72.47, 370 112.93, 370 138 C370 159.33, 359.33 170, 338 170 C225.74 170, 113.48 170, 32 170 C10.67 170, 0 159.33, 0 138 C0 111.15, 0 84.29, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#f0f4f8"/><path d="M32 0 C132.83 0, 233.66 0, 338 0 M32 0 C94.66 0, 157.33 0, 338 0 M338 0 C359.33 0, 370 10.67, 370 32 M338 0 C359.33 0, 370 10.67, 370 32 M370 32 C370 57.13, 370 82.26, 370 138 M370 32 C370 57.96, 370 83.92, 370 138 M370 138 C370 159.33, 359.33 170, 338 170 M370 138 C370 159.33, 359.33 170, 338 170 M338 170 C218.86 170, 99.73 170, 32 170 M338 170 C258.9 170, 179.8 170, 32 170 M32 170 C10.67 170, 0 159.33, 0 138 M32 170 C10.67 170, 0 159.33, 0 138 M0 138 C0 110.86, 0 83.73, 0 32 M0 138 C0 113.89, 0 89.78, 0 32 M0 32 C0 10.67, 10.67 0, 32 0 M0 32 C0 10.67, 10.67 0, 32 0" stroke="#cbd5df" stroke-width="1" fill="none"/></g><g transform="translate(64 194) rotate(0 125.769 14.375)"><text x="0" y="21.125" font-family="Helvetica, Segoe UI Emoji" font-size="25px" fill="#142b3b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">01  Define the contract</text></g><g transform="tran